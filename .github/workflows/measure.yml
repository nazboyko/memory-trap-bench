name: measure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "measure/**"
      - "go.mod"
      - ".github/workflows/measure.yml"

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: memory_limit=2G, opcache.enable_cli=0
          coverage: none
          tools: none
      - run: php -v
      - name: Measure three times
        run: |
          mkdir -p out
          for i in 1 2 3; do
            php measure/php/run.php > "out/gha-php-${{ matrix.php }}-$i.json"
          done
      - name: Lint the PHP snippets of the case catalog
        run: python3 -m memtrap.validate --syntax-only
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}
          path: out/
          if-no-files-found: error

  go:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}.x
          cache: false
      - run: go version && go vet ./measure/go
      - name: Measure three times
        run: |
          mkdir -p out
          go build -o measure-go ./measure/go
          for i in 1 2 3; do
            ./measure-go > "out/gha-go-${{ matrix.go }}-$i.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.go }}
          path: out/
          if-no-files-found: error
